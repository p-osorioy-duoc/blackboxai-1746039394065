{% extends "workshop/base.html" %}

{% block content %}
<h2 class="text-2xl font-bold mb-4">Registrar Nueva Reparación</h2>

<form method="post" class="bg-white p-6 rounded shadow max-w-lg">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="bg-blue-700 text-white px-4 py-2 rounded hover:bg-blue-800">Guardar</button>
</form>
{% endblock %}
